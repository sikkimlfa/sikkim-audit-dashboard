<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Local Fund Audit Dashboard - Govt of Sikkim</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    @media print {
      .no-print { display: none !important; }
      body { background-color: #ffffff !important; color: #000000 !important; }
      mark { background-color: transparent !important; font-weight: bold; padding: 0 !important; }
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen p-4 sm:p-6 lg:p-8">

  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Dashboard Header -->
    <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 bg-white p-6 rounded-xl shadow-sm border border-gray-200">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Directorate of Local Fund Audit</h1>
        <p class="text-xs text-gray-500 mt-1">Government of Sikkim — Dynamic Financial Analytics Dashboard</p>
      </div>

      <div class="flex flex-wrap items-center gap-2 no-print">
        <button onclick="exportFilteredToCSV()" class="inline-flex items-center px-3.5 py-2 border border-gray-300 text-xs font-medium rounded-lg text-gray-700 bg-white hover:bg-gray-50">
          Export CSV
        </button>
        <button onclick="exportChartsToPDFPresentation()" class="inline-flex items-center px-3.5 py-2 border border-gray-300 text-xs font-medium rounded-lg text-gray-700 bg-white hover:bg-gray-50">
          Export Presentation (PDF)
        </button>
      </div>
    </header>

    <!-- Visualizations Section -->
    <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-base font-bold text-gray-800">Receipts vs Payments Breakdown</h3>
        </div>
        <div class="relative h-64">
          <canvas id="barChart" aria-label="Receipts vs Payments Breakdown"></canvas>
        </div>
      </div>

      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-base font-bold text-gray-800">Closing Balance Share by Tier</h3>
        </div>
        <div class="relative h-64">
          <canvas id="doughnutChart" aria-label="Closing Balance Share by Tier"></canvas>
        </div>
      </div>
    </section>

    <!-- Financial Table Card -->
    <section class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="p-4 sm:p-6 border-b border-gray-100 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 no-print">
        <input type="text" id="searchInput" placeholder="Search local body, tier, FY..." class="block w-full sm:w-72 pr-10 pl-3 py-2 border border-gray-300 rounded-lg text-xs" />
        <span id="dataStatus" class="text-xs text-gray-500 italic">Loading dynamic audit data...</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-50 border-b border-gray-200 text-gray-600 text-xs uppercase font-semibold">
              <th class="py-3.5 px-4">Local Body Name</th>
              <th class="py-3.5 px-4">Tier</th>
              <th class="py-3.5 px-4 text-center">FY</th>
              <th class="py-3.5 px-4 text-right">Opening Bal (₹)</th>
              <th class="py-3.5 px-4 text-right">Receipts (₹)</th>
              <th class="py-3.5 px-4 text-right">Payments (₹)</th>
              <th class="py-3.5 px-4 text-right">Closing Bal (₹)</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-gray-100"></tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
    let allRecords = [];
    let filteredRecords = [];
    let barChartInstance = null;
    let doughnutChartInstance = null;

    function formatCurrency(val) {
      return new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 }).format(val || 0);
    }

    async function loadDynamicData() {
      const statusEl = document.getElementById('dataStatus');
      try {
        const response = await fetch('data/processed/records.json');
        if (!response.ok) throw new Error('Processed data file not found.');
        allRecords = await response.json();
        filteredRecords = [...allRecords];
        
        statusEl.textContent = `Loaded ${allRecords.length} records dynamically from annual report.`;
        renderTable();
        initCharts();
      } catch (err) {
        statusEl.textContent = 'Error loading dynamic data. Using fallback local records.';
        allRecords = [
          { id: 1, body: "Gangtok Municipal Corporation", tier: "Urban Local Body", year: "2024-25", ob: 14500000, receipts: 32000000, payments: 28000000, cb: 18500000 },
          { id: 2, body: "Namchi Municipal Council", tier: "Urban Local Body", year: "2024-25", ob: 8200000, receipts: 19500000, payments: 16200000, cb: 11500000 }
        ];
        filteredRecords = [...allRecords];
        renderTable();
        initCharts();
      }
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      const query = (document.getElementById('searchInput')?.value || '').toLowerCase();

      filteredRecords = allRecords.filter(r => 
        r.body.toLowerCase().includes(query) ||
        r.tier.toLowerCase().includes(query) ||
        r.year.toLowerCase().includes(query)
      );

      if (!filteredRecords.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-xs text-gray-500">No records found.</td></tr>`;
        return;
      }

      tbody.innerHTML = filteredRecords.map(row => `
        <tr class="hover:bg-gray-50 text-xs text-gray-800">
          <td class="py-3 px-4 font-medium">${row.body}</td>
          <td class="py-3 px-4">${row.tier}</td>
          <td class="py-3 px-4 text-center">${row.year}</td>
          <td class="py-3 px-4 text-right font-mono">${formatCurrency(row.ob)}</td>
          <td class="py-3 px-4 text-right font-mono text-emerald-700">${formatCurrency(row.receipts)}</td>
          <td class="py-3 px-4 text-right font-mono text-rose-700">${formatCurrency(row.payments)}</td>
          <td class="py-3 px-4 text-right font-mono font-bold text-gray-900">${formatCurrency(row.cb)}</td>
        </tr>
      `).join('');
    }

    function initCharts() {
      if (barChartInstance) barChartInstance.destroy();
      if (doughnutChartInstance) doughnutChartInstance.destroy();

      barChartInstance = new Chart(document.getElementById('barChart').getContext('2d'), {
        type: 'bar',
        data: {
          labels: allRecords.map(r => r.body.split(' ')[0]),
          datasets: [
            { label: 'Receipts (₹)', data: allRecords.map(r => r.receipts), backgroundColor: '#10b981' },
            { label: 'Payments (₹)', data: allRecords.map(r => r.payments), backgroundColor: '#f43f5e' }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });

      const urbanCb = allRecords.filter(r => r.tier.includes('Urban')).reduce((a, b) => a + b.cb, 0);
      const zillaCb = allRecords.filter(r => r.tier.includes('Zilla')).reduce((a, b) => a + b.cb, 0);

      doughnutChartInstance = new Chart(document.getElementById('doughnutChart').getContext('2d'), {
        type: 'doughnut',
        data: {
          labels: ['Urban Local Bodies', 'Zilla Panchayats'],
          datasets: [{ data: [urbanCb, zillaCb], backgroundColor: ['#6366f1', '#f59e0b'] }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadDynamicData();
      document.getElementById('searchInput')?.addEventListener('input', renderTable);
    });
  </script>
</body>
</html>
